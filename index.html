<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヤニイヌ</title>
<style>
:root{--bg:#f7f7f5;--fg:#535353;--sub:#8a8a86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1f1e;--fg:#e4e4e0;--sub:#8a8a86}}
:root[data-theme="dark"]{--bg:#1f1f1e;--fg:#e4e4e0;--sub:#8a8a86}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:8px;box-sizing:border-box}
canvas{width:100%;max-width:1400px;height:auto;border-radius:14px;touch-action:manipulation;cursor:pointer}
p{margin:8px 0 0;font-size:14px;color:var(--sub);text-align:center}
button{font:inherit;font-size:16px;padding:14px 28px;border-radius:12px;border:1px solid var(--sub);background:transparent;color:var(--fg);touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{background:var(--sub)}
#bar{display:flex;gap:8px;width:100%;max-width:1400px;margin-bottom:6px}
#bar button{flex:1;padding:10px 0;font-size:14px}
#duck{width:100%;max-width:1400px;padding:32px 0;font-size:26px;font-weight:bold;-webkit-touch-callout:none}
</style>
</head>
<body>
<div id="bar"><button id="pauseBtn">⏸ 一時停止</button><button id="restartBtn">↺ 最初から</button></div>
<canvas id="c" width="600" height="200"></canvas>
<button id="duck">しゃがむ（長押し）</button>
<p>スペース／↑／タップでジャンプ、↓でしゃがむ</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),G=170;let W=600;
const ST=[
{n:'ヤニ草原',a:'#7cc8ff',b:'#e6f6ff',fg:'#2f3b2c',gr:'#5f8f3e',l:'#3e6b27',t:'#2f3b2c'},

{n:'ヤニ高等学校',a:'#6a7ac8',b:'#ffd8b0',fg:'#20203a',gr:'#b8a888',l:'#887858',t:'#20203a'},
{n:'ヤニ大学(偏差値82)',a:'#2a3a6a',b:'#8a9ac8',fg:'#f0f0ff',gr:'#4a4a5a',l:'#c0a040',t:'#ffffff'},
{n:'ヤニ国会議事堂',a:'#5f9ad6',b:'#d8ecff',fg:'#2a2a3a',gr:'#6a8a5a',l:'#4a6a3a',t:'#2a2a3a'},
{n:'ヤニ実験場',a:'#14232f',b:'#2f5a66',fg:'#f2f7ff',gr:'#3a4a54',l:'#ffd23a',t:'#d8f4ff'},
{n:'ヤニパチ屋',a:'#14102a',b:'#3a2a5a',fg:'#f4f0ff',gr:'#1a1030',l:'#00e8d0',t:'#e8f4ff'},
{n:'ヤニ地獄への階段',a:'#12060c',b:'#7a1a10',fg:'#ffe9c4',gr:'#1c0a10',l:'#c0301a',t:'#ffd9a0'},
{n:'ヤニカス地獄',a:'#150000',b:'#a01800',fg:'#ffe9c4',gr:'#2a0a05',l:'#ff3a00',t:'#ffd9a0'},
{n:'ヤニ天国への階段',a:'#8fcfff',b:'#fff0c0',fg:'#7a5412',gr:'#f6efe0',l:'#ffd23a',t:'#6b4a10'},
{n:'ヤニ天国',a:'#9fd8ff',b:'#fff6d8',fg:'#7a5412',gr:'#fffaf0',l:'#ffd23a',t:'#6b4a10'},
{n:'ヤニ虚無空間',a:'#ffffff',b:'#ffffff',fg:'#cfcfd6',gr:'#ffffff',l:'#e6e6ee',t:'#9a9aa6'},
{n:'裏・ヤニ草原',a:'#14081e',b:'#5a1030',fg:'#e8dcc8',gr:'#14081a',l:'#ff2a3a',t:'#ffb0b0'}];
let hi=0;try{hi=+localStorage.getItem('dinoHi')||0}catch(e){}
let d,obs,clouds,speed,score,over,started,frame,next,dist,cur,banner,fg='#000',down=false;
function reset(){d={x:40,y:G-40,w:36,h:40,vy:0};obs=[];clouds=[{x:200,y:30},{x:480,y:60}];speed=6;score=0;over=false;frame=0;next=300;dist=0;cur=0;banner=90;miss=0;items=[];inext=600;bt=0;parts=[];guard=1;inv=0;bigb=0;say=0;rv=0;revived=0;rvc=0;er=0;erDone=0;pho=0;pre=0;fxs=[0,0,0,0,0,0];emg=0;emgDone=0;hlpDone=0;hlpOn=0;flags=[];savePop=0}
let telop=0,miss=0,items=[],inext=600,bt=0,parts=[],bx=0,by=0,ia=0,guard=1,inv=0,bigb=0,say=0,rv=0,revived=0,rvc=0,er=0,erDone=0,pho=0,eax=0,pre=0,fxs=[0,0,0,0,0,0],muteki=0,mtap=0,mlast=0,mflash=0,emg=0,emgDone=0,paused=0,emgShown=0,hlpDone=0,hlpOn=0,hlpD0=0,cp=0,flags=[],savePop=0;reset();started=false;
function jump(){
  if(paused)return;
  if(!started){started=true;telop=100;return}
  if(telop>0||rv>0||emg>0)return;
  if(over){if(bt>0&&bt<40)return;reset();score=cp;started=true;return}
  if(d.y+d.h>=G-0.5){d.h=40;d.y=G-40;d.vy=-11.5;if(muteki&&cur<24){const n=cur+1;score=n<=17?n*500:n*500+500;obs=[];items=[]}}
}
addEventListener('keydown',e=>{
  if(['Space','ArrowUp'].includes(e.code)){e.preventDefault();jump()}
  if(e.code==='ArrowDown'){e.preventDefault();down=true}
});
addEventListener('keyup',e=>{if(e.code==='ArrowDown')down=false});
c.addEventListener('pointerdown',e=>{
  if(!started){
    const r=c.getBoundingClientRect(),lx=(e.clientX-r.left)/r.width*W,ly=(e.clientY-r.top)/r.height*200,cw=(W-36)/2;
    if(lx>=12&&lx<=12+cw&&ly>=34&&ly<=106)jump();
    else if(lx>=24+cw&&lx<=24+2*cw&&ly>=34&&ly<=106){
      const now=performance.now();
      mtap=(now-mlast<1500)?mtap+1:1;mlast=now;
      if(mtap>=3){mtap=0;muteki=muteki?0:1;mflash=30}
    }
    return;
  }
  jump();
});
addEventListener('contextmenu',e=>e.preventDefault());
const pb=document.getElementById('pauseBtn'),rb=document.getElementById('restartBtn');
function setPause(v){if(!started)return;paused=v?1:0;pb.textContent=paused?'\u25b6 \u518d\u958b':'\u23f8 \u4e00\u6642\u505c\u6b62'}
pb.addEventListener('click',()=>setPause(!paused));
rb.addEventListener('click',()=>{paused=0;pb.textContent='\u23f8 \u4e00\u6642\u505c\u6b62';cp=0;reset();started=true;telop=0});
addEventListener('keydown',e=>{if(e.code==='KeyP')setPause(!paused)});
const b=document.getElementById('duck');
b.addEventListener('pointerdown',e=>{e.preventDefault();down=true});
['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>down=false));

function boom(){
  bx=false?W/2:d.x+18;by=false?d.y+d.h-24:d.y+20;parts=[];
  const m=bigb?1.7:1;for(let i=0;i<(bigb?150:50);i++){const a=Math.random()*6.283,sp=(1+Math.random()*5)*m;parts.push({vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,c:['#ffeb3b','#ff9800','#ff5722','#d32f2f','#555'][i%5],s:(2+Math.random()*5)*m})}
}
function update(){
  frame++;if(inv>0)inv--;if(say>0)say--;
  const onG=d.y+d.h>=G-0.5,duck=down&&onG,nh=duck?24:40;
  if(nh!==d.h){if(onG)d.y=G-nh;d.h=nh}
  d.w=duck?48:36;
  if(!onG&&down)d.vy+=1.2;
  d.vy+=0.6;d.y+=d.vy;
  if(d.y>G-d.h){d.y=G-d.h;d.vy=0}
  speed=(muteki&&duck)?31.2:5.3;
  score+=speed*0.1;dist+=speed;
  const LS=8500,q=score<LS?Math.floor(score/500):score<LS+1000?17:Math.floor((score-500)/500),ns=Math.min(24,q);
  if(ns!==cur){if(cur===8)next=260;cur=ns;banner=120;if(ns>=2&&ns%2===0&&cp<(ns<=17?ns*500:ns*500+500))flags.push({x:W+30,n:ns,got:0})}
  if(cur===10&&!hlpDone&&score>=5200){hlpDone=1;hlpOn=1;hlpD0=dist}
  if(hlpOn&&W+140-(dist-hlpD0)*.3<-120)hlpOn=0;
  if(cur===17&&!emgDone&&score>=LS+150){emgDone=1;if(!emgShown){emgShown=1;emg=1}}
  if(banner>0)banner--;
  if(cur===1&&!erDone&&score>=620){erDone=1;if(Math.random()<.34){pre=1;pho=(((240-W*.6)%480+480)%480)-((dist*.08)%480);eax=W*.6}}
  if(pre>0){pre++;eax-=speed*.08;if(pre>75){pre=0;er=1}}
  if(er>0){
    er++;eax-=speed*.08;
    if(er>=60&&er<=260&&er%40===0)items.push({x:W*.7+Math.random()*W*.3,y:-10,w:22,h:7,got:0,fall:1,vy:0,free:1});
    if(er>360){er=0;next=220}
  }
  next-=speed;
  if(next<=0&&!er&&!pre&&cur!==8){
    const r=Math.random();
    const B=(xx,yy,o)=>Object.assign({t:'b',x:W+xx,y:G-yy,w:34,h:24},o),fm=(lead,f)=>{lead.f=f;obs.push(lead,B(60,128,{p:1,f}))},sg=(lead,f)=>{lead.f=f;obs.push(lead)},q2=Math.random();
    if(cur===17){if(emgDone)obs.push({t:'m',x:W+20,y:G-40,by:G-40,w:30,h:40,f:1.45,ph:0})}
    else if(cur===23)obs.push({t:'d',x:W+20,y:G-44,by:G-44,w:24,h:44,f:1.2,ph:0});
    else if(cur===16&&r<.6){const hy=Math.random()<.5?26:50;obs.push({t:'x',x:W+20,y:G-hy,by:G-hy,w:70,h:26,f:1.25,ph:0})}
    else if(cur===12&&r<.6)obs.push({t:'r',x:W+20,y:G-36,by:G-36,w:30,h:36,f:1.3,ph:0,pal:Math.floor(Math.random()*6)});
    else if(score>400&&r>.93)(q2<.6?sg:fm)(B(20,48,{c:1}),1);
    else if(score>300&&r<0.35){
      const sm=cur!==8&&r>=0.15&&Math.random()<.55;
      if(sm)(q2<.6?sg:fm)(B(20,48,{s:1}),.88);
      else if(q2<.4)sg(B(20,48,{}),1);
      else if(q2<.65)fm(B(20,48,{}),1);
      else if(q2<.82)obs.push(B(20,48,{}),B(130,48,{p:1}));
      else sg(B(20,100,{}),1);
    }
    else if(Math.random()<.15)obs.push({t:'k',x:W+20,y:G-40,w:26,h:40,fx:FX()});
    else if(cur!==8&&Math.random()<.18){const h=34+Math.random()*14|0;obs.push({t:'y',x:W+20,y:G-h,w:16,h})}
    else{
      let cx=W+20;const n=Math.random()<.3?2+(Math.random()<.4):1;
      for(let i=0;i<n;i++){const h=28+Math.random()*24|0,w=12+(Math.random()*16|0);obs.push({t:'c',x:cx,y:G-h,w,h,fx:FX()});cx+=w+4+Math.random()*10}
    }
    if(cur===10)obs.forEach(o=>{if(o.t==='b'&&o.x>W){o.t='u';o.k=Math.floor(Math.random()*6);o.f=1;o.s=0;o.c=0}});
    const m=170+speed*10,q=Math.random(),ex=obs.length?Math.max(0,obs[obs.length-1].x-(W+20)):0;
    next=ex+(q<.2?m+Math.random()*50:q<.8?m+50+Math.random()*250:m+300+Math.random()*250);
  }
  obs.forEach(o=>o.x-=speed*(o.f||1));
  obs=obs.filter(o=>o.x+o.w>-10);
  obs.forEach(o=>{if(o.t==='m'){o.ph++;const t=(o.ph%90)/90;o.y=o.by-(t<.5?Math.sin(t*2*Math.PI)*36:0)}else if(o.t==='r'){o.ph++;const t=(o.ph%70)/70;o.y=o.by-(t<.5?Math.sin(t*2*Math.PI)*30:0)}else if(o.t==='x'){o.ph++;o.y=o.by+Math.sin(o.ph*.2)*3}else if(o.t==='d'){o.ph++;const t=(o.ph%80)/80;o.y=o.by-(t<.4?Math.sin(t/.4*Math.PI)*22:0)}});
  inext-=speed;
  if(inext<=0&&cur!==8&&cur!==23){
    const cl=ia?30*speed+90:140;
    if(next>cl&&obs.every(o=>o.x+o.w<W+20-cl)){items.push({x:W+20,y:ia?G-88:G-30,w:22,h:7,got:0});inext=700+Math.random()*600;ia=Math.random()<.55?1:0}
  }
  items.forEach(it=>{it.x-=speed;if(it.fall){it.vy=Math.min(5,it.vy+.15);it.y+=it.vy;if(it.y>=G-30){it.y=G-30;it.fall=0}}});
  flags.forEach(f=>{f.x-=speed;if(!f.got&&f.x<d.x+24){f.got=1;cp=f.n<=17?f.n*500:f.n*500+500;savePop=100}});flags=flags.filter(f=>f.x>-40);
  for(const it of items){
    if(it.got)continue;
    if(d.x-4<it.x+it.w+4&&d.x+d.w+4>it.x-4&&d.y<it.y+it.h+4&&d.y+d.h>it.y-4){it.got=1;score+=50;if(miss>0)miss--}
    else if(it.x+it.w<d.x-6){
      it.got=-1;
      if(!it.free&&!muteki){miss++;if(miss>=3){over=true;bt=1;boom();if(score>hi){hi=score;try{localStorage.setItem('dinoHi',Math.floor(hi))}catch(e){}}}}
    }
  }
  items=items.filter(it=>it.got!==1&&it.x>-30);
  clouds.forEach(k=>{k.x-=speed*0.2;if(k.x<-50){k.x=W+20;k.y=20+Math.random()*50}});
  for(const o of obs){
    if(!muteki&&(inv<=0||o.c)&&d.x+4<o.x+o.w-3&&d.x+d.w-4>o.x+3&&d.y+(d.h>30?8:4)<o.y+o.h-3&&d.y+d.h>o.y+3){
      if(o.t==='y'){o.dead=1;miss=0;say=90}
      else if(o.s){
        o.dead=1;miss=Math.min(3,miss+2);
        if(miss>=3){over=true;bt=1;boom();if(score>hi){hi=score;try{localStorage.setItem('dinoHi',Math.floor(hi))}catch(e){}}}
      }else if(o.c){
        o.dead=1;over=true;bt=1;bigb=1;boom();if(score>hi){hi=score;try{localStorage.setItem('dinoHi',Math.floor(hi))}catch(e){}}
      }else if((o.t==='b'||o.t==='u')&&guard>0){
        guard--;o.dead=1;inv=45;
      }else{
        over=true;
        if(score>hi){hi=score;try{localStorage.setItem('dinoHi',Math.floor(hi))}catch(e){}}
      }
    }
  }
  obs=obs.filter(o=>!o.dead);
}
function drawRumble(){
  const t=pre,ax=eax,ay=G-120,k=Math.min(1,t/20);
  x.fillStyle='rgba(255,120,30,'+(.12+.1*Math.sin(t*.5))*k+')';x.fillRect(0,0,W,G);
  x.fillStyle='rgba(255,170,60,'+(.5*k)+')';x.beginPath();x.arc(ax,ay,10+Math.sin(t*.6)*3+t*.15,0,7);x.fill();
  for(let i=0;i<8;i++){const a=(t*3+i*17)%40;x.fillStyle='#ffb347';x.fillRect(ax+((i*29)%23-11)*.8,ay-a*1.2,2,2)}
  x.save();x.textAlign='center';x.font='bold 18px system-ui,sans-serif';x.lineJoin='round';x.lineWidth=4;x.strokeStyle='rgba(60,0,0,.8)';
  const tx=W/2+(Math.random()-.5)*4,ty=44+(Math.random()-.5)*3;x.strokeText('ゴゴゴゴゴ…',tx,ty);x.fillStyle='#ffd9a0';x.fillText('ゴゴゴゴゴ…',tx,ty);x.restore();
}
function drawErupt(){
  const t=er,ax=eax,ay=G-120;
  const k=Math.min(1,t/30)*(t>300?Math.max(0,(360-t)/60):1);
  x.fillStyle='rgba(255,90,20,'+(.35*k)+')';x.fillRect(0,0,W,G);
  const g=x.createLinearGradient(0,ay,0,0);g.addColorStop(0,'rgba(255,200,80,'+(.8*k)+')');g.addColorStop(1,'rgba(255,90,20,0)');
  x.fillStyle=g;x.fillRect(ax-18,0,36,ay+4);
  x.fillStyle='rgba(60,30,25,'+(.7*k)+')';
  for(let j=0;j<7;j++){x.beginPath();x.arc(ax+Math.sin(t*.03+j*2)*60+(j-3)*18,8+(j%3)*8,26+j*3,0,7);x.fill()}
  if(t>30&&t<330){
    for(let i=0;i<120;i++){
      const a=t-30-(i*3)%240;if(a<0||a>120)continue;
      const vx=(((i*37)%21)-10)*.28,vy=-(3+(i*13)%6),px=ax+vx*a,py=ay+vy*a+.045*a*a;
      if(i%3){x.fillStyle=i%2?'#ffb347':'#ff5a1a';x.fillRect(px,py,2+i%3,2+i%3)}
      else{x.save();x.translate(px,py);x.rotate(a*.2+i);x.fillStyle='#fffdf5';x.fillRect(-7,-1.5,10,3);x.fillStyle='#e0a050';x.fillRect(3,-1.5,4,3);x.fillStyle='#ff4a1a';x.fillRect(-9,-1.5,2,3);x.restore()}
    }
  }
  if(0){x.save();x.globalAlpha=Math.min(1,(130-t)/30);x.textAlign='center';x.font='900 36px system-ui,sans-serif';x.lineJoin='round';x.lineWidth=7;x.strokeStyle='#7a0000';x.strokeText('大噴火！！',W/2,66);x.fillStyle='#ffe14a';x.fillText('大噴火！！',W/2,66);x.restore()}
}
function bigCig(mx){
  const bx=mx-26,by=G-34,H=118;
  x.save();
  x.fillStyle='#86bf8a';x.beginPath();x.moveTo(mx-120,G);x.lineTo(mx,G-92);x.lineTo(mx+120,G);x.fill();
  x.translate(bx,by);x.rotate(-.32);
  x.fillStyle='rgba(0,0,0,.25)';x.fillRect(-15,-H-2,30,H+14);
  x.fillStyle='#fffdf5';x.fillRect(-13,-H+16,26,H-20);
  x.fillStyle='#e6e2d4';x.fillRect(5,-H+16,8,H-20);

    if(t<(bigb?12:5)){x.fillStyle='rgba(255,255,255,'+(bigb?1-t/12:.8-t*.15)+')';x.fillRect(0,0,W,200)}
  }
  if(muteki){x.save();x.font='bold 10px system-ui,sans-serif';x.textAlign='left';x.fillStyle='hsl('+(frame*6%360)+',100%,60%)';x.fillText('無敵',16,62);x.restore()}
  const pt=pre>0?pre:(er>0&&er<45?75+er:0);
  if(pt>0&&!bt){const pop=pt<10?pt/10*1.4:1+Math.sin(pt*.4)*.08;x.save();x.globalAlpha=pre>0?1:1-er/45;x.translate(d.x+34,Math.max(26,d.y-12));x.scale(pop,pop);x.textAlign='center';x.textBaseline='middle';x.font='900 30px system-ui,sans-serif';x.lineJoin='round';x.lineWidth=5;x.strokeStyle='#fff';x.strokeText('!',0,0);x.fillStyle='#e5252a';x.fillText('!',0,0);x.restore()}
  if(say>0&&!bt&&miss<2){x.save();x.font='bold 17px system-ui,sans-serif';x.textAlign='center';x.lineJoin='round';x.lineWidth=4;x.strokeStyle='rgba(0,0,0,.8)';const sx=false?W/2:d.x+18,sy=Math.max(32,(false?d.y+d.h-56:d.y)-16);x.strokeText('ヤニ最高！',sx,sy);x.fillStyle='#fff27a';x.fillText('ヤニ最高！',sx,sy);x.restore()}
  if(miss>=2&&!bt){x.save();x.font='bold 13px system-ui,sans-serif';x.textAlign='center';x.lineJoin='round';x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.75)';const tx=(false?W/2:d.x+18)+(Math.random()-.5)*2,ty=Math.max(36,(false?d.y+d.h-56:d.y)-10)+(Math.random()-.5)*2;x.strokeText('なんもねぇ',tx,ty);x.fillStyle='#fff';x.fillText('なんもねぇ',tx,ty);x.restore()}
  x.fillStyle=s.t;x.font='bold 14px system-ui,sans-serif';x.textAlign='left';x.fillText('ニコチン切れ',16,24);
  for(let i=0;i<3;i++){x.beginPath();x.arc(110+i*20,19,6,0,7);if(i<miss){x.fillStyle='#e5252a';x.fill()}else{x.globalAlpha=.5;x.lineWidth=2;x.strokeStyle=s.t;x.stroke();x.globalAlpha=1}}
  x.fillStyle=s.t;x.font='bold 10px system-ui,sans-serif';x.textAlign='left';x.fillText('鳥ガード',16,45);x.beginPath();x.arc(66,42,4,0,7);if(guard>0){x.fillStyle='#3bb54a';x.fill()}else{x.globalAlpha=.5;x.lineWidth=2;x.strokeStyle=s.t;x.stroke();x.globalAlpha=1}
  x.fillStyle=s.t;x.font='bold 16px ui-monospace,Menlo,monospace';x.textAlign='right';
  x.globalAlpha=.6;x.fillText('HI '+String(Math.floor(hi)).padStart(5,'0'),W-100,24);x.globalAlpha=1;
  x.fillText(String(Math.floor(score)).padStart(5,'0'),W-16,24);
  x.textAlign='center';x.font='bold 22px system-ui,sans-serif';
  if(banner>0&&started){x.globalAlpha=Math.min(1,banner/30);x.fillText('ステージ：'+s.n,W/2,76);x.globalAlpha=1}
  if(!started){x.font='bold 40px system-ui,"Hiragino Sans","Noto Sans JP",sans-serif';x.fillText('ヤニイヌ',W/2,80);x.font='bold 18px system-ui,sans-serif';x.fillText('タップかスペースでスタート',W/2,115)}
  if(telop>0){
    const t=100-telop,fo=telop<14?telop/14:1;
    x.save();
    x.fillStyle='rgba(0,0,0,'+Math.min(.55,t/6*.55)*fo+')';x.fillRect(0,0,W,200);
    const sc=t<7?3-2*(t/7):1,sh=t>=7&&t<22?(22-t)*.5:0;
    x.globalAlpha=telop<14?fo:Math.min(1,t/3);
    x.translate(W/2+(Math.random()-.5)*sh*2,100+(Math.random()-.5)*sh*2);x.scale(sc,sc);
    x.textAlign='center';x.textBaseline='middle';
    x.font='900 58px system-ui,"Hiragino Sans","Noto Sans JP",sans-serif';
    x.lineJoin='round';x.lineWidth=10;x.strokeStyle='#b00000';x.strokeText('ヤニを求めて',0,0);
    x.fillStyle='#fff';x.fillText('ヤニを求めて',0,0);
    x.restore();
    if(t<6){x.fillStyle='rgba(255,255,255,'+(.8-t*.13)+')';x.fillRect(0,0,W,200)}
  }
  flags.forEach(f=>{
    const fx=f.x,wv=Math.sin(frame*.2)*3;
    x.save();
    if(!f.got){x.globalAlpha=.3+.2*Math.sin(frame*.15);x.fillStyle='#ffe14a';x.beginPath();x.arc(fx,G-30,16,0,7);x.fill();x.globalAlpha=1}
    x.fillStyle='#e8e8ee';x.fillRect(fx-1,G-46,2.5,46);x.fillStyle='#888';x.beginPath();x.ellipse(fx,G,6,2,0,0,7);x.fill();
    x.fillStyle=f.got?'#ffd23a':'#ff4a5a';x.beginPath();x.moveTo(fx+1.5,G-46);x.lineTo(fx+18+wv,G-41);x.lineTo(fx+1.5,G-35);x.fill();
    x.restore();
  });
  if(emg>0)drawEmg();
  if(rv>0)drawKami();
  if(paused){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,200);x.textAlign='center';x.textBaseline='alphabetic';x.fillStyle='#fff';x.font='bold 26px system-ui,"Hiragino Sans","Noto Sans JP",sans-serif';x.fillText('一時停止中',W/2,96);x.font='13px system-ui,"Hiragino Sans","Noto Sans JP",sans-serif';x.fillStyle='#ffd23a';x.fillText('「再開」を押してね',W/2,122)}
  if(over&&!rv&&(!bt||bt>30)){x.fillText(bt?(bigb?'ヤニ狂いの鳥と大爆発…':'ニコチン切れで爆発した…'):'ゲームオーバー',W/2,90);x.font='15px system-ui,sans-serif';x.fillText('タップかスペースでもう一度',W/2,118);if(cp>0){x.fillStyle='#ffd23a';x.fillText('セーブ地点から再開',W/2,138)}}
}
function fit(){W=innerWidth<700?420:600;const k=Math.max(1,Math.ceil(c.clientWidth*(devicePixelRatio||1)/W));c.width=W*k;c.height=200*k;x.setTransform(k,0,0,k,0,0)}
addEventListener('resize',fit);fit();
function revive(){over=false;bt=0;bigb=0;parts=[];miss=0;guard=Math.max(guard,1);inv=120;obs=[];items=[];next=300;inext=500;d.vy=0;d.h=40;d.y=G-40;rv=0;rvc=0;revived=1}
function loop(){
  if(paused&&started){draw();requestAnimationFrame(loop);return}
  if(!started)frame++;
  if(telop>0)telop--;else if(started&&!over&&emg===0)update();
  if(emg>0){emg++;if(emg>260)emg=0}
  if(over&&!rvc){rvc=1;if(!revived&&Math.random()<.125){rv=1;bt=0;bigb=0;parts=[]}}
  if(rv>0){rv++;if(rv>240)revive()}
  if(over&&bt>0)bt++;
  draw();requestAnimationFrame(loop)
}
loop();
</script>
